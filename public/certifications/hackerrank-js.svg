<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bgLight)" rx="16"/>
  <!-- Elegant Certificate Border -->
  <rect x="24" y="24" width="752" height="512" fill="none" stroke="#E2E8F0" stroke-width="2" rx="12"/>
  <rect x="30" y="30" width="740" height="500" fill="none" stroke="#CBD5E1" stroke-width="1" rx="8"/>

  <!-- Top HackerRank Icon -->
  <g transform="translate(400, 75)">
    <circle cx="0" cy="0" r="28" fill="#1E293B"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="0" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#22C55E" text-anchor="middle">H|<tspan fill="#FFFFFF">|</tspan></text>
  </g>

  <!-- Title -->
  <text x="400" y="145" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#0F172A" text-anchor="middle">Certificate of Accomplishment</text>

  <!-- Role Banner -->
  <g transform="translate(400, 190)">
    <rect x="-190" y="-18" width="380" height="36" fill="#1E293B" rx="4"/>
    <polygon points="-205,0 -190,-14 -190,14" fill="#0F172A"/>
    <polygon points="205,0 190,-14 190,14" fill="#0F172A"/>
    <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">JavaScript (Intermediate)</text>
  </g>

  <!-- Presentation text -->
  <text x="400" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="2">PRESENTED TO</text>

  <!-- Name in cursive / script style -->
  <text x="400" y="305" font-family="'Brush Script MT', 'Great Vibes', 'Caveat', cursive, Georgia" font-size="42" font-style="italic" font-weight="500" fill="#1E293B" text-anchor="middle">Khustar Hussain</text>
  <line x1="200" y1="320" x2="600" y2="320" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Description -->
  <text x="400" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">The bearer of this certificate has passed the HackerRank skill certification test</text>

  <!-- Footer Info -->
  <g transform="translate(80, 475)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#334155">Earned on: <tspan font-weight="500" fill="#64748B">22 May, 2025</tspan></text>
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">ID: CE10A9692F20</text>
  </g>

  <!-- Signature -->
  <g transform="translate(620, 455)">
    <path d="M-50,0 Q-20,-20 10,-5 T40,-15" fill="none" stroke="#1E293B" stroke-width="2"/>
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Harishankaran K</text>
    <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">CTO, HackerRank</text>
  </g>
</svg>
