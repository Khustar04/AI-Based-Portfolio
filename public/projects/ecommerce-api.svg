<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <g transform="translate(100, 80)">
    <rect width="600" height="240" rx="16" fill="url(#cardBg)" stroke="#1e3a8a" stroke-width="1.5" />
    
    <circle cx="30" cy="30" r="6" fill="#ef4444" />
    <circle cx="48" cy="30" r="6" fill="#eab308" />
    <circle cx="66" cy="30" r="6" fill="#3b82f6" />
    <text x="95" y="34" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="600">E-Commerce REST API • Java Spring Boot Microservices</text>

    <!-- Endpoints mockup -->
    <g transform="translate(40, 65)">
      <!-- GET /products -->
      <rect x="0" y="0" width="520" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <rect x="10" y="8" width="48" height="18" rx="4" fill="#22c55e" fill-opacity="0.2" />
      <text x="34" y="21" fill="#4ade80" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">GET</text>
      <text x="70" y="21" fill="#e2e8f0" font-family="monospace" font-size="12">/api/v1/products?category=electronics&amp;limit=20</text>
      <text x="480" y="21" fill="#22c55e" font-family="monospace" font-size="11" font-weight="700">200 OK</text>

      <!-- POST /orders -->
      <rect x="0" y="42" width="520" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <rect x="10" y="50" width="48" height="18" rx="4" fill="#3b82f6" fill-opacity="0.2" />
      <text x="34" y="63" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">POST</text>
      <text x="70" y="63" fill="#e2e8f0" font-family="monospace" font-size="12">/api/v1/orders/checkout</text>
      <text x="480" y="63" fill="#3b82f6" font-family="monospace" font-size="11" font-weight="700">201 CRE</text>

      <!-- POST /payments/webhook -->
      <rect x="0" y="84" width="520" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <rect x="10" y="92" width="48" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2" />
      <text x="34" y="105" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">POST</text>
      <text x="70" y="105" fill="#e2e8f0" font-family="monospace" font-size="12">/api/v1/payments/stripe/webhook</text>
      <text x="480" y="105" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">200 OK</text>
    </g>

    <text x="40" y="215" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11">Tech Stack: Java 21 • Spring Boot 3.3 • MySQL • Redis Cache • Stripe API</text>
  </g>

  <g transform="translate(100, 375)">
    <text x="0" y="20" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">E-Commerce REST API</text>
    <text x="280" y="20" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="14" font-weight="500">— High-Throughput Microservice</text>
    <rect x="0" y="32" width="220" height="3" fill="url(#cyanGlow)" rx="1.5" />
  </g>
</svg>
