        <rect x="425" y="25" width="18" height="18" rx="4" fill="#4ade80" />
        <rect x="450" y="25" width="18" height="18" rx="4" fill="#ea580c" />
        <rect x="475" y="25" width="18" height="18" rx="4" fill="#22c55e" />
        <rect x="500" y="25" width="18" height="18" rx="4" fill="#15803d" />
        <rect x="525" y="25" width="18" height="18" rx="4" fill="#166534" />

        <!-- Row 3 -->
        <rect x="0" y="50" width="18" height="18" rx="4" fill="#15803d" />
        <rect x="25" y="50" width="18" height="18" rx="4" fill="#166534" />
        <rect x="50" y="50" width="18" height="18" rx="4" fill="#22c55e" />
