        <rect x="300" y="50" width="18" height="18" rx="4" fill="#15803d" />
        <rect x="325" y="50" width="18" height="18" rx="4" fill="#166534" />
        <rect x="350" y="50" width="18" height="18" rx="4" fill="#22c55e" />
        <rect x="375" y="50" width="18" height="18" rx="4" fill="#ea580c" />
        <rect x="400" y="50" width="18" height="18" rx="4" fill="#22c55e" />
        <rect x="425" y="50" width="18" height="18" rx="4" fill="#15803d" />
        <rect x="450" y="50" width="18" height="18" rx="4" fill="#4ade80" />
        <rect x="475" y="50" width="18" height="18" rx="4" fill="#166534" />
        <rect x="500" y="50" width="18" height="18" rx="4" fill="#22c55e" />
        <rect x="525" y="50" width="18" height="18" rx="4" fill="#f97316" />
      </g>
    </g>

    <!-- Mini chart at bottom -->
    <path d="M30,195 Q100,165 180,185 T320,150 T450,170 T550,140" fill="none" stroke="#f97316" stroke-width="3" />
    <circle cx="550" cy="140" r="4" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" />
    <text x="30" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Tech Stack: Spring Boot 3.3 • MySQL 8.0 • JWT Auth • React 18 • Recharts</text>
  </g>

  <!-- Big Title Banner -->
  <g transform="translate(100, 375)">
    <text x="0" y="20" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">Streakify</text>
    <text x="110" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">— Gamified DSA Tracking Platform</text>
    <rect x="0" y="32" width="200" height="3" fill="url(#streakGlow)" rx="1.5" />
  </g>
