<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="streakGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.25">
    <path d="M0,75 H800 M0,150 H800 M0,225 H800 M0,300 H800 M0,375 H800" />
    <path d="M100,0 V450 M200,0 V450 M300,0 V450 M400,0 V450 M500,0 V450 M600,0 V450 M700,0 V450" />
  </g>

  <!-- Glowing Orb -->
  <circle cx="650" cy="120" r="140" fill="#f97316" opacity="0.15" filter="url(#glow)" />
  <circle cx="150" cy="350" r="100" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />

  <!-- Heatmap preview mockup -->
  <g transform="translate(100, 80)">
    <rect width="600" height="240" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Header bar -->
    <circle cx="30" cy="30" r="6" fill="#ef4444" />
    <circle cx="48" cy="30" r="6" fill="#eab308" />
    <circle cx="66" cy="30" r="6" fill="#22c55e" />
    <text x="95" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Streakify • 365-Day Activity Heatmap &amp; DSA Tracker</text>

    <!-- Stat Pill -->
    <rect x="460" y="18" width="115" height="26" rx="13" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1" />
    <text x="480" y="35" fill="#fb923c" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🔥 142-DAY STREAK</text>

    <!-- Heatmap Grid -->
    <g transform="translate(30, 65)">
      <!-- 12 columns of 5 rows of contribution cells -->
      <g fill="#1e293b">
        <!-- Mock cells with dynamic greens & oranges -->
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#22c55e" />
        <rect x="25" y="0" width="18" height="18" rx="4" fill="#15803d" />
        <rect x="50" y="0" width="18" height="18" rx="4" fill="#166534" />
        <rect x="75" y="0" width="18" height="18" rx="4" fill="#22c55e" />
        <rect x="100" y="0" width="18" height="18" rx="4" fill="#f97316" />
