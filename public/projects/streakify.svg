        <rect x="25" y="25" width="18" height="18" rx="4" fill="#22c55e" />
        <rect x="50" y="25" width="18" height="18" rx="4" fill="#4ade80" />
        <rect x="75" y="25" width="18" height="18" rx="4" fill="#15803d" />
        <rect x="100" y="25" width="18" height="18" rx="4" fill="#22c55e" />
        <rect x="125" y="25" width="18" height="18" rx="4" fill="#f97316" />
        <rect x="150" y="25" width="18" height="18" rx="4" fill="#ea580c" />
        <rect x="175" y="25" width="18" height="18" rx="4" fill="#22c55e" />
        <rect x="200" y="25" width="18" height="18" rx="4" fill="#15803d" />
        <rect x="225" y="25" width="18" height="18" rx="4" fill="#4ade80" />
        <rect x="250" y="25" width="18" height="18" rx="4" fill="#22c55e" />
        <rect x="275" y="25" width="18" height="18" rx="4" fill="#166534" />
        <rect x="300" y="25" width="18" height="18" rx="4" fill="#22c55e" />
        <rect x="325" y="25" width="18" height="18" rx="4" fill="#f97316" />
