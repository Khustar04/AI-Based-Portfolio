<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <g transform="translate(100, 80)">
    <rect width="600" height="240" rx="16" fill="url(#cardBg)" stroke="#4c1d95" stroke-width="1.5" />
    
    <circle cx="30" cy="30" r="6" fill="#ef4444" />
    <circle cx="48" cy="30" r="6" fill="#eab308" />
    <circle cx="66" cy="30" r="6" fill="#8b5cf6" />
    <text x="95" y="34" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AI Job Finder • Resume Parsing &amp; Job Match Scoring</text>

    <!-- Visual Match Meter -->
    <g transform="translate(40, 75)">
      <!-- Resume Card -->
      <rect x="0" y="0" width="160" height="110" rx="10" fill="#1e1b4b" stroke="#6d28d9" stroke-width="1" />
      <text x="15" y="25" fill="#e9d5ff" font-family="system-ui" font-size="12" font-weight="700">📄 PDF Resume</text>
      <rect x="15" y="38" width="130" height="6" rx="3" fill="#6d28d9" />
      <rect x="15" y="52" width="100" height="6" rx="3" fill="#4c1d95" />
      <rect x="15" y="66" width="120" height="6" rx="3" fill="#6d28d9" />
      <rect x="15" y="80" width="70" height="6" rx="3" fill="#4c1d95" />

      <!-- Matching Arrow -->
      <g transform="translate(185, 35)">
        <path d="M0,20 H70 M50,5 L70,20 L50,35" fill="none" stroke="#a855f7" stroke-width="3" />
        <text x="35" y="10" fill="#d8b4fe" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">AI PARSE</text>
      </g>

      <!-- Match Score Badge -->
      <g transform="translate(285, 5)">
        <rect width="220" height="100" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" />
        <circle cx="50" cy="50" r="32" fill="#2e1065" stroke="#ec4899" stroke-width="3" />
        <text x="50" y="55" fill="#f472b6" font-family="system-ui" font-size="16" font-weight="800" text-anchor="middle">94%</text>
        <text x="100" y="38" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="700">Backend Engineer</text>
        <text x="100" y="56" fill="#a78bfa" font-family="system-ui" font-size="11">Java • Spring • MySQL</text>
        <text x="100" y="74" fill="#34d399" font-family="system-ui" font-size="10" font-weight="600">✓ Strong Keyword Match</text>
      </g>
    </g>

    <text x="40" y="215" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11">Tech Stack: Python • NLP • Fastify • React 18 • Vector Match</text>
  </g>

  <g transform="translate(100, 375)">
    <text x="0" y="20" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">AI Job Finder</text>
    <text x="175" y="20" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="14" font-weight="500">— Resume Parser &amp; Job Matcher</text>
    <rect x="0" y="32" width="220" height="3" fill="url(#purpleGlow)" rx="1.5" />
  </g>
</svg>
