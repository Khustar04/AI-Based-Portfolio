<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="indigoGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <g transform="translate(100, 80)">
    <rect width="600" height="240" rx="16" fill="url(#cardBg)" stroke="#3730a3" stroke-width="1.5" />
    
    <circle cx="30" cy="30" r="6" fill="#ef4444" />
    <circle cx="48" cy="30" r="6" fill="#eab308" />
    <circle cx="66" cy="30" r="6" fill="#6366f1" />
    <text x="95" y="34" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Real-Time Chat Engine • STOMP WebSocket &amp; Pub/Sub</text>

    <!-- Chat Messages Preview -->
    <g transform="translate(40, 65)">
      <!-- Message Left -->
      <rect x="0" y="0" width="280" height="34" rx="12" fill="#1e293b" />
      <text x="14" y="21" fill="#e2e8f0" font-family="system-ui" font-size="12">Hey Khustar! How fast is the WebSocket?</text>

      <!-- Message Right -->
      <rect x="230" y="42" width="290" height="34" rx="12" fill="#4338ca" />
      <text x="244" y="63" fill="#ffffff" font-family="system-ui" font-size="12">Sub-10ms latency via Spring STOMP broker ⚡</text>

      <!-- Connection Status Badge -->
      <g transform="translate(0, 88)">
        <rect width="180" height="24" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1" />
        <circle cx="14" cy="12" r="4" fill="#22c55e" />
        <text x="26" y="16" fill="#4ade80" font-family="monospace" font-size="10" font-weight="700">WS CONNECTED: 10,000 req/s</text>
      </g>
    </g>

    <text x="40" y="215" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11">Tech Stack: Java • Spring WebSocket • STOMP • Redis Pub/Sub • JWT Auth</text>
  </g>

  <g transform="translate(100, 375)">
    <text x="0" y="20" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">Real-Time Chat Engine</text>
    <text x="265" y="20" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="14" font-weight="500">— WebSocket &amp; Pub/Sub Service</text>
    <rect x="0" y="32" width="220" height="3" fill="url(#indigoGlow)" rx="1.5" />
  </g>
</svg>
