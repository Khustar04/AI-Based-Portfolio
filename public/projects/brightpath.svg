<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#021c16" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Roadmaps diagram -->
  <g transform="translate(100, 80)">
    <rect width="600" height="240" rx="16" fill="url(#cardBg)" stroke="#065f46" stroke-width="1.5" />
    
    <circle cx="30" cy="30" r="6" fill="#ef4444" />
    <circle cx="48" cy="30" r="6" fill="#eab308" />
    <circle cx="66" cy="30" r="6" fill="#10b981" />
    <text x="95" y="34" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="600">BrightPath • Smart E-Learning &amp; Academic Roadmaps</text>

    <!-- Node Roadmap preview -->
    <g transform="translate(50, 90)">
      <line x1="40" y1="50" x2="180" y2="50" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" />
      <line x1="180" y1="50" x2="320" y2="50" stroke="#10b981" stroke-width="3" />
      <line x1="320" y1="50" x2="460" y2="50" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" />

      <circle cx="40" cy="50" r="22" fill="#047857" stroke="#34d399" stroke-width="2" />
      <text x="40" y="55" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">11</text>
      <text x="40" y="88" fill="#a7f3d0" font-family="system-ui" font-size="11" text-anchor="middle">Class 11</text>

      <circle cx="180" cy="50" r="22" fill="#047857" stroke="#34d399" stroke-width="2" />
      <text x="180" y="55" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">12</text>
      <text x="180" y="88" fill="#a7f3d0" font-family="system-ui" font-size="11" text-anchor="middle">Class 12</text>

      <circle cx="320" cy="50" r="24" fill="#10b981" stroke="#ffffff" stroke-width="2" />
      <text x="320" y="55" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">UG</text>
      <text x="320" y="90" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">College / B.Tech</text>

      <circle cx="460" cy="50" r="22" fill="#047857" stroke="#34d399" stroke-width="2" />
      <text x="460" y="55" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">AI</text>
      <text x="460" y="88" fill="#a7f3d0" font-family="system-ui" font-size="11" text-anchor="middle">Career Assistant</text>
    </g>

    <text x="50" y="215" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">Tech Stack: Next.js • React • Tailwind CSS • GSAP Timeline Animations</text>
  </g>

  <!-- Big Title Banner -->
  <g transform="translate(100, 375)">
    <text x="0" y="20" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">BrightPath</text>
    <text x="135" y="20" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="14" font-weight="500">— Modern E-Learning &amp; Academic Hub</text>
    <rect x="0" y="32" width="220" height="3" fill="url(#emeraldGlow)" rx="1.5" />
  </g>
</svg>
